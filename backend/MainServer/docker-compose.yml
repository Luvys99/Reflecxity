# Mac에서 Main Server 옆에 띄우는 DB와 큐. 값은 같은 폴더의 .env에서 읽는다
name: reflecxity
services:
  db:
    image: mariadb:11
    container_name: reflecxity-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: reflecxity
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"            # DB는 Main(같은 Mac)만 쓴다
    volumes:
      - reflecxity-db:/var/lib/mysql

  redis:
    image: redis:7
    container_name: reflecxity-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"            # Main
      - "${TAILSCALE_IP}:6379:6379"      # Windows 워커 (Tailscale 통로)
    volumes:
      - reflecxity-redis-data:/data

# 이미 있는 볼륨을 그대로 쓴다 → 컨테이너를 다시 만들어도 데이터 유지
volumes:
  reflecxity-db:
    external: true
  reflecxity-redis-data:
    external: true
