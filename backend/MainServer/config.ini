[DATABASE]
host=localhost
database=reflecxity
# user, password는 여기에 쓰지 않는다 → .env 또는 환경 변수 DB_USER, DB_PASSWORD

[FILE_PATH]
base_dir=.

[MODEL_SERVER]
# 기본값: Model Server가 같은 컴퓨터에 있을 때. 다른 컴퓨터면 .env의 MODEL_SERVER_URL로 바꾼다
api_url=http://localhost:48000

[CORS]
origins=http://localhost,http://localhost:28300

[TTS]
default_pitch=3
